<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>404 — Page Not Found | JABIR MAHMUD KAWSAR</title>
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Space+Mono&display=swap" rel="stylesheet">
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        background-color: #120408;
        color: #FFFFFF;
        font-family: 'Space Grotesk', -apple-system, sans-serif;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        text-align: center;
        background-image: radial-gradient(circle at 50% 30%, rgba(225, 29, 116, 0.12) 0%, transparent 60%), radial-gradient(circle at 80% 80%, rgba(23, 107, 255, 0.12) 0%, transparent 50%);
      }
      .card {
        max-width: 520px;
        width: 100%;
        background: rgba(255, 255, 255, 0.04);
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 24px;
        padding: 48px 32px;
        backdrop-filter: blur(16px);
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
      }
      .logo {
        width: 56px;
        height: 56px;
        margin: 0 auto 24px;
        background: linear-gradient(135deg, #176BFF, #120408);
        border: 1px solid rgba(255, 255, 255, 0.2);
        border-radius: 16px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: 700;
        font-size: 22px;
        color: #fff;
        position: relative;
      }
      .dot {
        position: absolute;
        top: 6px;
        right: 6px;
        width: 6px;
        height: 6px;
        background: #E11D74;
        border-radius: 50%;
      }
      .tag {
        font-family: 'Space Mono', monospace;
        font-size: 11px;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        color: #55C8FF;
        margin-bottom: 12px;
      }
      h1 {
        font-size: 44px;
        font-weight: 800;
        letter-spacing: -0.02em;
        margin-bottom: 16px;
      }
      p {
        font-size: 15px;
        color: rgba(255, 255, 255, 0.7);
        line-height: 1.6;
        margin-bottom: 32px;
      }
      .btn {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 14px 28px;
        background: #176BFF;
        color: #FFFFFF;
        text-decoration: none;
        font-family: 'Space Mono', monospace;
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        border-radius: 12px;
        transition: all 0.3s ease;
        box-shadow: 0 8px 24px rgba(23, 107, 255, 0.3);
      }
      .btn:hover {
        background: #E11D74;
        box-shadow: 0 8px 24px rgba(225, 29, 116, 0.3);
        transform: translateY(-2px);
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="logo">
        JM
        <div class="dot"></div>
      </div>
      <div class="tag">404 // ARTIFACT NOT FOUND</div>
      <h1>Page Not Found</h1>
      <p>The design artifact or page you are looking for does not exist or has been relocated within the portfolio catalogue.</p>
      <a href="./" class="btn">
        Return to Portfolio &rarr;
      </a>
    </div>
  </body>
</html>
